name: HistoLoop Docker
on:
  push:
    paths: ["SVC_GPU/**", ".github/workflows/histoloop.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build CPU image
        run: docker build --platform linux/amd64 -f SVC_GPU/human_loop/Dockerfile -t histoloop:ci SVC_GPU
      - name: Generate synthetic data and run container
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/histoloop-demo" "$RUNNER_TEMP/histoloop-state"
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python \
            --mount "type=bind,src=$RUNNER_TEMP/histoloop-demo,dst=/demo" \
            histoloop:ci /opt/histoloop/SVC_GPU/human_loop/scripts/generate_demo.py \
            --output /demo --runtime-root /data
          docker run -d --name histoloop --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:8765:8765 \
            --mount "type=bind,src=$RUNNER_TEMP/histoloop-demo,dst=/data,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/histoloop-state,dst=/state" \
            --tmpfs /cache:mode=1777,size=768m histoloop:ci
          python3 SVC_GPU/human_loop/scripts/smoke_container.py --state "$RUNNER_TEMP/histoloop-state"
          docker restart histoloop
          python3 SVC_GPU/human_loop/scripts/smoke_container.py --state "$RUNNER_TEMP/histoloop-state" --check-existing
          test "$(docker inspect --format '{{.State.Running}}' histoloop)" = true
      - name: Clean up
        if: always()
        run: docker rm -f histoloop || true
